# ITSM — Nginx reverse proxy
# Layout 7A: the CAP process serves the UI5 frontend too; Nginx only
# terminates HTTP, compresses, and forwards everything to 127.0.0.1:4004.
#
# Install:
#   sudo cp deploy/nginx/itsm.conf /etc/nginx/sites-available/itsm
#   sudo ln -sf /etc/nginx/sites-available/itsm /etc/nginx/sites-enabled/itsm
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    # No IPv6 listener — instance IPv6 networking is off for milestone 1.
    # When a domain + IPv6 is added later:  listen [::]:80;
    server_name 3.111.154.43;

    # Attachments + org logos are buffered in Node memory on upload. Hard cap.
    client_max_body_size 15m;

    # Compress OData / JSON / JS / CSS on the wire.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css application/xml image/svg+xml text/plain;

    # Bare IP -> app entry point.
    location = / {
        return 302 /webapp/index.html;
    }

    # Everything else -> CAP. It serves /webapp (static UI5), /odata/v4/*,
    # /auth/*, and issues the 308 redirect from /webapp/odata -> /odata.
    location / {
        proxy_pass http://127.0.0.1:4004;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    access_log /var/log/nginx/itsm.access.log;
    error_log  /var/log/nginx/itsm.error.log;
}
